data:
  type: csv
  path: data/raw/online_shoppers_intention.csv
  params:
    sep: ","
    encoding: "utf-8"

experiment:
  name: online_shoppers_intention_prediction
  target: Revenue
  task_type: classification
  test_size: 0.2
  random_state: 42

eda:
  enabled: false
  output_dir: outputs/online_shoppers_intention/eda
  steps:
    summary: true
    categorical: true
    distributions: true
    correlations: true
    missing_values: true
    outliers: true
    target_mean_by_category: true
    plot_target_mean_bar: true

preprocessing:
  missing_values:
    enabled: false
    strategy: "median"
    columns: null  # ou lista de colunas específicas

  scaler:
    enabled: true
    strategy: "standard"  # opções: "standard", "minmax", "robust"
    columns: null         # ou lista de colunas específicas (ex: ["age", "income"])

  encoder:
    enabled: true
    strategy: "onehot"  # ou "label"
    columns: ["Month", "OperatingSystems", "Browser", "Region", "TrafficType", "VisitorType", "Weekend"]

  auto_feature_generation:
    enabled: false
    target_col: "Revenue"
    problem_type: "classification"
    correlation_threshold: 0.3
    top_k: 15

feature_selection:
  enabled: true
  # Statistical based feature selection (ANOVA, mutual information)
  statistical:
    enabled: true
    method: statistical
    params:
      method: f_test  # or mutual_info
      k: 10
      problem_type: classification

  # Correlation based feature selection
  correlation:
    enabled: true
    method: correlation
    params:
      method: pearson  # or spearman, kendall
      threshold: 0.95
      target_corr_threshold: 0.01

  # Feature importance based selection (using tree-based models)
  importance:
    enabled: true
    method: importance
    params:
      n_features: 10
      problem_type: classification
      importance_threshold: 0.01